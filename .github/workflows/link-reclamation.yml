name: Link Reclamation

on:
  schedule:
    - cron: '0 14 * * 3'   # Wednesday 14:00 UTC
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Dry run (print the report, send nothing, log nothing)'
        required: false
        default: false
        type: boolean

concurrency:
  group: link-reclamation
  cancel-in-progress: false

jobs:
  run:
    # Scheduled runs are off until the repository variable ENABLE_SCHEDULE is 'true',
    # so a fresh fork or an unconfigured copy never runs (or fails) on its own.
    if: github.event_name == 'workflow_dispatch' || vars.ENABLE_SCHEDULE == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - run: npm ci

      # config/brand.json is gitignored; CI writes it from a repository variable
      - name: Write brand config
        env:
          BRAND_JSON: ${{ vars.BRAND_JSON }}
        run: |
          if [ -n "$BRAND_JSON" ]; then printf '%s' "$BRAND_JSON" > config/brand.json; fi

      # The log records which links and mentions were already reported, so the
      # same opportunity is not raised every week. It travels in the Actions cache.
      - name: Restore state
        uses: actions/cache/restore@v4
        with:
          path: state
          key: link-reclamation-state-${{ github.run_id }}
          restore-keys: |
            link-reclamation-state-

      - name: Check broken links and unlinked mentions
        run: node src/link-reclamation.js ${{ inputs.dry_run && '--dry-run' || '' }}
        env:
          AHREFS_API_TOKEN:   ${{ secrets.AHREFS_API_TOKEN }}
          ANTHROPIC_API_KEY:  ${{ secrets.ANTHROPIC_API_KEY }}
          GMAIL_USER:         ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          SENDER_NAME:        ${{ vars.SENDER_NAME }}

      - name: Save state
        if: always() && inputs.dry_run != true
        uses: actions/cache/save@v4
        with:
          path: state
          key: link-reclamation-state-${{ github.run_id }}
